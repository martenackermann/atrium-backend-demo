name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: atrium_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev -d atrium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      # The test suite sets every other variable itself (vitest.config.mts) and creates a fresh
      # database next to TEST_DATABASE_URL for each run.
      DATABASE_URL: postgresql://dev:dev@localhost:5432/atrium_test
      TEST_DATABASE_URL: postgresql://dev:dev@localhost:5432/atrium_test
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations match the Prisma schema
        run: |
          pnpm db:migrate:deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Test (unit + e2e)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI document is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build and start API + PostgreSQL + Mailpit
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Health check and demo sign-in
        run: |
          curl --fail --silent --show-error http://localhost:3100/api/v1/health
          curl --fail --silent --show-error http://localhost:3100/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"emma.employee@example.com","password":"demo1234"}' | grep -q '"accessToken"'

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
